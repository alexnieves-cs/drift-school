<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drift-school</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/ui/app.css" />
    <script>
      if (typeof window !== 'undefined' && window.crossOriginIsolated !== true && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('./coi-serviceworker.js').then(() => {
          if (!navigator.serviceWorker.controller) location.reload();
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
